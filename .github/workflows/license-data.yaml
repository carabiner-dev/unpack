name: license-data

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Resolve Go versions
      id: go-versions
      uses: carabiner-dev/actions/go/versions@94f29392187fe5082d1195a7d4cae3a7ddf09d9c # v1.2.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.go-versions.outputs.GO_VERSION_STABLE }}
        cache: false

    - name: Regenerate license data
      run: go generate ./license/

    - name: Verify no changes
      run: |
        if ! git diff --exit-code -- license/; then
          echo "::error::License data is out of date. Run 'go generate ./license/' and commit the changes."
          exit 1
        fi
