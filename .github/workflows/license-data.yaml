name: license-data

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve Go versions
      id: go-versions
      uses: carabiner-dev/actions/go/versions@32587e82f960d49b36101e8c45d1956e511965d3 # v1.2.9

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ steps.go-versions.outputs.GO_VERSION_STABLE }}
        cache: false

    - name: Regenerate license data
      run: go generate ./license/

    - name: Verify no changes
      run: |
        if ! git diff --exit-code -- license/; then
          echo "::error::License data is out of date. Run 'go generate ./license/' and commit the changes."
          exit 1
        fi
