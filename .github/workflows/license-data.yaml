name: license-data

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Resolve Go versions
      id: go-versions
      uses: carabiner-dev/actions/go/versions@e0e3b8149dafed833431095bc148d50e7eade4e8 # v1.2.0

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ steps.go-versions.outputs.GO_VERSION_STABLE }}
        cache: false

    - name: Regenerate license data
      run: go generate ./license/

    - name: Verify no changes
      run: |
        if ! git diff --exit-code -- license/; then
          echo "::error::License data is out of date. Run 'go generate ./license/' and commit the changes."
          exit 1
        fi
