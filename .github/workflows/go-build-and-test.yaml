name: go-tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version-file: 'go.mod'
        check-latest: true
        cache: true

    - name: Test
      env:
          UNPACK_FORCE_TESTS: 1
      run: |
        cd source/npm/testdata/demorepo/
        npm ci
        cd -
        cd source/npm/testdata/k8s.io/
        npm ci
        cd -
        go get -d ./...
        go test -v ./...
