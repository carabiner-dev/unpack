name: go-tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      go-versions: ${{ steps.matrix.outputs.go-versions }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Resolve Go versions
      id: go-versions
      uses: carabiner-dev/actions/go/versions@94f29392187fe5082d1195a7d4cae3a7ddf09d9c # v1.2.1

    - name: Build version matrix
      id: matrix
      run: |
        echo "go-versions=[\"${{ steps.go-versions.outputs.GO_VERSION_STABLE }}\",\"${{ steps.go-versions.outputs.GO_VERSION_PREVIOUS }}\"]" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-versions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ${{ fromJSON(needs.resolve-versions.outputs.go-versions) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Preserve line endings
      run: git config --global core.autocrlf false

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: false

    - name: Install npm test dependencies
      run: |
        npm ci --prefix source/npm/testdata/demorepo/
        npm ci --prefix source/npm/testdata/k8s.io/

    - name: Test
      env:
          UNPACK_FORCE_TESTS: 1
      run: |
        go get -d ./...
        go test -v ./...
