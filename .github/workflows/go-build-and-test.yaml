name: go-tests

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      go-versions: ${{ steps.matrix.outputs.go-versions }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Resolve Go versions
      id: go-versions
      uses: carabiner-dev/actions/go/versions@32587e82f960d49b36101e8c45d1956e511965d3 # v1.2.9

    - name: Build version matrix
      id: matrix
      run: |
        echo "go-versions=[\"${{ steps.go-versions.outputs.GO_VERSION_STABLE }}\",\"${{ steps.go-versions.outputs.GO_VERSION_PREVIOUS }}\"]" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-versions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ${{ fromJSON(needs.resolve-versions.outputs.go-versions) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - name: Preserve line endings
      run: git config --global core.autocrlf false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: false

    - name: Install npm test dependencies
      run: |
        npm ci --prefix source/npm/testdata/demorepo/
        npm ci --prefix source/npm/testdata/k8s.io/

    # The Python conformance tests compare extractions against uv's own
    # reading of the same lockfiles. With uv on the PATH they run natively
    # on every OS; without it they would fall back to Docker on Linux and
    # skip elsewhere.
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    # Re-enable the race detector (go test -race) once a release-utils
    # release carries the fix for the data race in http.Agent.Client,
    # which every concurrent group fetch trips over. The detector needs
    # cgo and a C toolchain; all three runner images ship one (mingw on
    # Windows).
    - name: Test
      env:
          UNPACK_FORCE_TESTS: 1
      run: |
        go get -d ./...
        go test -v ./...
